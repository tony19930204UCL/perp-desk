name: PAPER review tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Versions
        run: python3 --version && node --version
      - name: Exporter contract
        run: python3 -m unittest discover -s automation/tests -v
      - name: PAPER isolated suite
        working-directory: lab
        run: python3 -m unittest discover -s tests -v
      - name: Issue 23 isolated discovery pipeline
        run: |
          mkdir -p artifacts/issue-23-discovery
          (cd lab && python3 discovery_pipeline_check.py --self-check) > artifacts/issue-23-discovery/pipeline.json
          python3 lab/discovery_operational_check.py > artifacts/issue-23-discovery/operational.json
      - name: Upload Issue 23 synthetic discovery evidence
        if: ${{ always() && hashFiles('artifacts/issue-23-discovery/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-23-discovery-evidence
          path: artifacts/issue-23-discovery
          if-no-files-found: error
      - name: Issue 22 isolated scheduler-adapter acceptance
        run: |
          mkdir -p artifacts/issue-22-event-gate
          python3 lab/operator_event_gate_acceptance.py > artifacts/issue-22-event-gate/acceptance.json
      - name: Upload Issue 22 synthetic event-gate evidence
        if: ${{ always() && hashFiles('artifacts/issue-22-event-gate/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-22-event-gate-evidence
          path: artifacts/issue-22-event-gate
          if-no-files-found: error
      - name: Issue 26 owner-resumption acceptance
        run: |
          mkdir -p artifacts/issue-26-owner-handoff
          python3 lab/operator_owner_handoff_acceptance.py > artifacts/issue-26-owner-handoff/acceptance.json
      - name: Upload Issue 26 owner-resumption evidence
        if: ${{ always() && hashFiles('artifacts/issue-26-owner-handoff/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-26-owner-handoff-evidence
          path: artifacts/issue-26-owner-handoff
          if-no-files-found: error
      - name: Issue 34 transport, sticky-stop and fixed-capacity acceptance
        run: |
          set -o pipefail
          mkdir -p artifacts/issue-34-runtime-capacity
          (cd lab && python3 -m unittest -v tests.test_discovery_lab.RunnerSubprocessTests tests.test_discovery_lab.RetentionEvidenceTests tests.test_discovery_lab.Issue34TransportCapacityTests) 2>&1 | tee artifacts/issue-34-runtime-capacity/focused-tests.txt
          python3 lab/issue34_acceptance.py > artifacts/issue-34-runtime-capacity/acceptance.json
      - name: Upload Issue 34 isolated runtime/capacity evidence
        if: ${{ always() && hashFiles('artifacts/issue-34-runtime-capacity/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-34-runtime-capacity-evidence
          path: artifacts/issue-34-runtime-capacity
          if-no-files-found: error
      - name: Issue 3 real browser acceptance
        run: python3 lab/browser_issue3_acceptance.py --output artifacts/issue-3-browser
      - name: Upload Issue 3 synthetic browser evidence
        if: ${{ always() && hashFiles('artifacts/issue-3-browser/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-3-browser-evidence
          path: artifacts/issue-3-browser
          if-no-files-found: error
      - name: Public timing observation (engineering evidence only)
        run: python3 scripts/public_source_timing_probe.py
